name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

defaults:
  run:
    working-directory: worker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # worker-configuration.d.ts is generated, not committed.
      - name: Typecheck
        run: npx wrangler types && npx tsc --noEmit

      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://projects.xavierloo.com/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Deployment setup required
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo '::notice::Set CLOUDFLARE_API_TOKEN in the cloudflare environment to enable automatic Worker deployments. Checks passed; deployment was skipped.'
